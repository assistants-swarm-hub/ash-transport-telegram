name: Release

# Publishes this transport to the org's npm registry on GitHub Packages, as the
# package named in package.json, and tags the commit. An operator installs it
# into their core with `npm install <package>`; nothing else ships.
#
# THE GATE IS THE REGISTRY, NOT THE DIFF. A package.json version that changed
# on this push says nothing about whether anything shipped: a release that
# failed half-way leaves the manifest untouched, so a "did the version change?"
# check would never retry it. This workflow asks what is actually released —
# is this version on the registry, is the git tag on origin — and ships only
# what is missing. Any later push to main finishes an interrupted release, and
# a version already on the registry is never published over.
#
# It also checks what it released: the published package is installed FROM
# the registry into an empty project, imported, and its default export read,
# before the tag goes up. A package that builds but does not import is the
# failure a build alone does not catch, and it is the one an operator meets.
#
# Releasing: bump `version` in package.json (`npm version patch
# --no-git-tag-version`), commit, push. Manual dispatch (Actions -> Release ->
# Run workflow) re-runs the checks and the tag for the CURRENT version; a
# version already on the registry is never replaced — bump it instead.
#
# Auth everywhere is the job's own GITHUB_TOKEN — no registry secrets to keep.
# It authenticates the SDK install (GitHub Packages wants a token even for a
# public package), the publish, and the tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_REGISTRY: https://npm.pkg.github.com

jobs:
  plan:
    name: What is not released yet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      name: ${{ steps.plan.outputs.name }}
      version: ${{ steps.plan.outputs.version }}
      package_pending: ${{ steps.plan.outputs.package_pending }}
      tag_pending: ${{ steps.plan.outputs.tag_pending }}
      anything: ${{ steps.plan.outputs.anything }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: ${{ env.NPM_REGISTRY }}
          scope: "@assistants-swarm-hub"

      - id: plan
        name: Ask the registry what exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry."
            package_pending=false
          else
            echo "$name@$version is not released -> publish it."
            package_pending=true
          fi
          echo "package_pending=$package_pending" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "tag v$version is already on origin."
            tag_pending=false
          else
            echo "tag v$version is missing."
            tag_pending=true
          fi
          echo "tag_pending=$tag_pending" >> "$GITHUB_OUTPUT"

          if [ "$package_pending$tag_pending" = "falsefalse" ]; then
            echo "Version $version is already released; nothing to do."
            echo "anything=false" >> "$GITHUB_OUTPUT"
          else
            echo "anything=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Typecheck, test and build
    needs: plan
    # A missing git tag counts: a commit is not marked released until it has
    # passed.
    if: needs.plan.outputs.anything == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading the SDK from GitHub Packages. Stated rather than inherited:
      # a repository whose default workflow permissions are restricted gets
      # `contents: read` and nothing else, and the install would 401 on a
      # package that is public.
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: ${{ env.NPM_REGISTRY }}
          scope: "@assistants-swarm-hub"
          cache: npm
      # `npm install`, not `npm ci`: the lockfile may be generated on another
      # OS and omit Linux-only optional native deps (sharp's, which the SDK
      # pulls in for image normalization), which `npm ci`'s strict sync check
      # rejects.
      - run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  publish:
    name: Publish, check and tag
    needs: [plan, verify]
    if: needs.plan.outputs.anything == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Push the release tag back to the repo.
      contents: write
      # Publish to the org's npm registry.
      packages: write
    env:
      NAME: ${{ needs.plan.outputs.name }}
      VERSION: ${{ needs.plan.outputs.version }}
      PENDING: ${{ needs.plan.outputs.package_pending }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: ${{ env.NPM_REGISTRY }}
          scope: "@assistants-swarm-hub"
          cache: npm

      - run: npm install --no-audit --no-fund

      # `prepack` builds; the tarball holds dist and the README, nothing else.
      - name: Publish
        if: env.PENDING == 'true'
        run: npm publish --access public

      # Installed FROM the registry into an empty project — the way an
      # operator's core gets it — and imported: the default export must be a
      # transport.
      - name: Verify what was published
        run: |
          set -eu
          dir=$(mktemp -d)
          cd "$dir"
          printf '@assistants-swarm-hub:registry=%s\n//npm.pkg.github.com/:_authToken=%s\n' \
            "$NPM_REGISTRY" "$NODE_AUTH_TOKEN" > .npmrc
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$NAME@$VERSION"
          installed=$(node -p "require('./node_modules/$NAME/package.json').version")
          if [ "$installed" != "$VERSION" ]; then
            echo "::error::the registry served $installed, not $VERSION"
            exit 1
          fi
          node --input-type=module -e "
            const { default: transport } = await import('$NAME');
            const { descriptor, adapter, normalize, addressing } = transport ?? {};
            if (!descriptor?.id || typeof adapter?.connect !== 'function' ||
                typeof normalize !== 'function' || typeof addressing !== 'function') {
              throw new Error('the default export is not a transport');
            }
            console.log('imports; source id', descriptor.id, '—', descriptor.name);
          "

      # Last: the tag exists only for a version that is on the registry and
      # imported from it.
      - name: Create and push release tag
        run: |
          set -eu
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin, skipping tag creation."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi
